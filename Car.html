<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Website</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
.hero{position:relative;height:100vh;width:100%;overflow:hidden;display:flex;align-items:center}
.hero video{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.overlay{position:absolute;inset:0;background:linear-gradient(to right,rgba(0,0,0,0.7),rgba(0,0,0,0.3));z-index:-1}
nav{position:absolute;top:0;width:100%;display:flex;justify-content:space-between;padding:30px 50px;color:white;z-index:2;font-size:14px;letter-spacing:2px}
.content{padding:0 50px;color:white;max-width:700px}
.content h1{font-size:clamp(40px,7vw,90px);line-height:0.9;font-weight:900;text-transform:uppercase}
.content h1 span{color:#555;font-weight:300}
.content p{margin:20px 0 30px;color:#ccc;font-size:16px;line-height:1.6}
.btn{display:inline-block;padding:16px 32px;background:white;color:black;text-decoration:none;font-weight:700;font-size:13px;letter-spacing:1px;transition:0.3s}
.btn:hover{background:#ddd}
</style>
</head>
<body>
<div class="hero">
  <video autoplay muted loop playsinline poster="poster.jpg">
    <source src="2026-10-28-042648973.mp4" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <nav><div><a href="https://www.owenbreezy.vercel.app"><img src="owen-breezy-tech-logo-pro-transparent.png" alt="logo" height="100" width="auto"></a></div></nav>
  <div class="content">
    <h1>DRIVEN <br><span>BY DESIGN</span></h1>
    <p>Not just a car. A statement. Experience precision engineering with cinematic presence.</p>
    <a href="#" class="btn">EXPLORE COLLECTION</a>
  </div>
</div>
</body>
</html>
